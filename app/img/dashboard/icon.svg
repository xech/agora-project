<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Ombre portée douce -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Dégradé léger pour la page arrière -->
    <linearGradient id="backPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#BDBDBD" />
    </linearGradient>

    <!-- Dégradé pour la page principale -->
    <linearGradient id="frontPageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Page d'arrière-plan (légèrement inclinée) -->
    <path d="M 28 14 L 88 18 L 82 86 L 22 82 Z" fill="url(#backPageGrad)" />

    <!-- Page principale (premier plan) -->
    <rect x="12" y="20" width="68" height="70" rx="3" fill="url(#frontPageGrad)" stroke="#E0E0E0" stroke-width="0.5" />

    <!-- En-tête : Titres "NEWS" -->
    <text x="46" y="38" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="1" fill="#212121" text-anchor="middle">NEWS</text>
    
    <!-- Ligne de séparation sous le titre -->
    <line x1="18" y1="42" x2="74" y2="42" stroke="#424242" stroke-width="1.2" />

    <!-- Zone Image (cadre moderne à droite) -->
    <rect x="46" y="48" width="28" height="34" rx="2" fill="#E0E0E0" />
    <path d="M 46 72 L 54 62 L 62 70 L 68 64 L 74 72 V 80 A 2 2 0 0 1 72 82 H 48 A 2 2 0 0 1 46 80 Z" fill="#BDBDBD" />
    <circle cx="53" cy="56" r="3" fill="#BDBDBD" />

    <!-- Colonnes de texte (lignes épurées à gauche) -->
    <!-- Colonne 1 -->
    <line x1="18" y1="48" x2="40" y2="48" stroke="#616161" stroke-width="2" stroke-linecap="round" />
    <line x1="18" y1="53" x2="40" y2="53" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="58" x2="38" y2="58" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="63" x2="40" y2="63" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="68" x2="35" y2="68" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />

    <!-- Colonne 2 (bas) -->
    <line x1="18" y1="75" x2="40" y2="75" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="80" x2="40" y2="80" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="85" x2="32" y2="85" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
